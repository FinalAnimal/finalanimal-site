<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conor Maloney — Final Animal</title>
  <meta name="description" content="Conor Maloney is an audiovisual artist based in Galway, Ireland. Immersive installation, audioreactive performance and electronic instruments.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: #080808; overflow: hidden; height: 100vh; }

    #hero-video {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      background: #080808 url("Assets/video/hero-poster.jpg") center / cover no-repeat;
    }

    /* Scrim — keeps the cream type legible over the bright footage. */
    .hero-scrim {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(8,8,8,.62) 0%, rgba(8,8,8,.18) 26%, rgba(8,8,8,.30) 58%, rgba(8,8,8,.82) 100%),
        rgba(8,8,8,.20);
    }

    .hero-ui {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 64px 56px;
      pointer-events: none;
      z-index: 2;
    }

    .hero-eyebrow {
      font-family: var(--sans);
      font-size: 11px;
      letter-spacing: .16em;
      color: var(--accent);
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeUp .8s ease .4s forwards;
    }

    .hero-name {
      font-family: var(--display);
      font-size: clamp(52px, 7vw, 88px);
      font-weight: 300;
      color: var(--text);
      line-height: 1.0;
      letter-spacing: .02em;
      margin-bottom: 8px;
      opacity: 0;
      animation: fadeUp .9s ease .7s forwards;
    }

    .hero-sub {
      font-family: var(--sans);
      font-size: 12px;
      letter-spacing: .14em;
      color: var(--accent-dim);
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeUp .8s ease 1.0s forwards;
    }

    .enter-btn {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: var(--sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .22em;
      color: var(--text);
      border: 0.5px solid rgba(242,239,231,.38);
      padding: 15px 42px;
      /* Sits mid-screen where the scrim is thinnest — carries its own backdrop
         so the label holds up against the footage's brightest frames. */
      background: rgba(8,8,8,.42);
      backdrop-filter: blur(8px);
      cursor: pointer;
      text-decoration: none;
      transition: border-color .4s, color .4s, letter-spacing .4s, background .4s;
      pointer-events: all;
      opacity: 0;
      animation: fadeButton .8s ease 1.4s forwards;
      width: fit-content;
    }

    .enter-btn:hover {
      border-color: var(--accent);
      color: var(--text);
      background: linear-gradient(rgba(242,239,231,.07), rgba(242,239,231,.07)), rgba(8,8,8,.42);
      letter-spacing: .28em;
    }

    .enter-btn .arrow {
      transition: transform .4s;
      opacity: .5;
    }

    .enter-btn:hover .arrow {
      transform: translateX(4px);
      opacity: 1;
    }

    .hero-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 64px;
      pointer-events: none;
      z-index: 2;
    }

    .logo {
      font-family: var(--sans);
      font-size: 11px;
      letter-spacing: .16em;
      color: var(--accent-dim);
      opacity: 0;
      animation: fadeIn .8s ease .2s forwards;
    }

    .hero-links {
      display: flex;
      gap: 28px;
      pointer-events: all;
      opacity: 0;
      animation: fadeIn .8s ease .2s forwards;
    }

    .hero-links a {
      font-family: var(--sans);
      font-size: 11px;
      letter-spacing: .14em;
      color: var(--accent-dim);
      text-decoration: none;
      transition: color .3s;
    }

    .hero-links a:hover { color: var(--accent); }

    .scroll-hint {
      position: fixed;
      bottom: 56px;
      right: 64px;
      font-family: var(--sans);
      font-size: 9px;
      letter-spacing: .14em;
      color: rgba(139,135,125,.45);
      writing-mode: vertical-rl;
      opacity: 0;
      animation: fadeIn 1s ease 2s forwards;
      z-index: 2;
    }

    @media (max-width: 640px) {
      .hero-ui  { padding: 0 28px 44px; }
      .hero-nav { padding: 22px 28px; }
      .scroll-hint { right: 28px; bottom: 44px; }
    }

    /* Reduced motion is handled in script — the video holds on its poster frame. */

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeButton {
      from { opacity: 0; transform: translate(-50%, calc(-50% + 18px)); }
      to   { opacity: 1; transform: translate(-50%, -50%); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>

<video id="hero-video"
       autoplay muted loop playsinline
       preload="auto"
       poster="Assets/video/hero-poster.jpg"
       aria-hidden="true" tabindex="-1">
  <source src="Assets/video/hero.mp4" type="video/mp4">
</video>

<div class="hero-scrim"></div>

<nav class="hero-nav">
  <div class="logo">FINAL ANIMAL</div>
  <div class="hero-links">
    <a href="work.html">Work</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>
</nav>

<div class="hero-ui">
  <div class="hero-eyebrow">AUDIOVISUAL ARTIST — GALWAY, IRELAND</div>
  <h1 class="hero-name">Conor<br>Maloney</h1>
  <div class="hero-sub">FINAL ANIMAL</div>
  <a href="work.html" class="enter-btn">
    ENTER
    <span class="arrow">→</span>
  </a>
</div>

<div class="scroll-hint">finalanimal.com</div>

<script>
(function () {
  const video = document.getElementById('hero-video');
  if (!video) return;

  const stillOnly = window.matchMedia('(prefers-reduced-motion: reduce)');

  function apply() {
    if (stillOnly.matches) {
      video.removeAttribute('autoplay');
      video.pause();
      video.currentTime = 0;
      return;
    }
    // Safari/iOS occasionally reject the initial autoplay; retry once muted.
    const attempt = video.play();
    if (attempt && typeof attempt.catch === 'function') {
      attempt.catch(function () {
        video.muted = true;
        video.play().catch(function () {
          // Autoplay blocked outright — the poster frame stands in.
        });
      });
    }
  }

  apply();
  stillOnly.addEventListener('change', apply);

  // Some browsers stall background video on tab switch; nudge it back.
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && !stillOnly.matches && video.paused) apply();
  });
})();
</script>
</body>
</html>
